version: '3.9'

services:
  api:
    build:
      context: ./backend
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__Default=Data Source=/data/app.db
      - Admin__Token=${ADMIN_TOKEN:-super-secret-admin-token}
      - FrontendOrigin=http://localhost:4173
    ports:
      - '5000:5000'
    volumes:
      - api-data:/data
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
    environment:
      - VITE_API_URL=http://api:5000/api
    ports:
      - '4173:80'
    depends_on:
      - api

  db:
    image: nouchka/sqlite3:latest
    command: tail -f /dev/null
    volumes:
      - api-data:/data

volumes:
  api-data:
